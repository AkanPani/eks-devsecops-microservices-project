---
- name: Bootstrap GoCartOps EKS cluster
  hosts: localhost
  connection: local
  gather_facts: false

  vars_files:
    - "../group_vars/{{ env | default('dev') }}/vars.yml"
    - "../group_vars/{{ env | default('dev') }}/vault.yml"

  roles:
    - role: eks-bootstrap
    - role: k8s-setup
    - role: helm-deploy
    - role: smoke-test
