---
plugin: amazon.aws.aws_ec2
regions:
  - ap-south-1
filters:
  tag:Project: gocartops
  instance-state-name: running
keyed_groups:
  - key: tags.Environment
    prefix: env
  - key: tags.Role
    prefix: role
hostnames:
  - tag:Name
  - private-ip-address
compose:
  ansible_host: public_ip_address
