serviceName: product-service

replicaCount: 2

image:
  repository: "<account-id>.dkr.ecr.ap-south-1.amazonaws.com/product-service"
  tag: "latest"
  pullPolicy: IfNotPresent

container:
  port: 8081

service:
  type: ClusterIP
  port: 8081
  targetPort: 8081

configMap:
  enabled: true
  data:
    APP_ENV: dev
    PORT: "8081"

serviceAccount:
  create: true
  name: product-service-sa
  annotations:
    eks.amazonaws.com/role-arn: "arn:aws:iam::<account-id>:role/gocartops-dev-product-service-irsa"

ingress:
  enabled: false

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80
